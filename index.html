<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date With Me ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="hearts"></div>

<div class="container">

<div id="page1" class="page active">

<h1>💖 Will You Go On A Date With Me? 💖</h1>

<img src="https://media.tenor.com/Hw7f-4l0zgEAAAAi/love-bear.gif" class="gif">

<div class="btns">
<button id="yesBtn">YES ❤️</button>
<button id="noBtn">NO 😭</button>
</div>

</div>

<div id="page2" class="page">

<h2>Yayyyyy ❤️</h2>

<label>Select Date</label>
<input type="date" id="date">

<label>Select Time</label>
<input type="time" id="time">

<label>Food 🍕</label>
<input type="text" id="food" placeholder="Pizza">

<label>Place 📍</label>
<input type="text" id="place" placeholder="Cafe">

<button id="nextBtn">Continue ❤️</button>

</div>

<div id="page3" class="page">

<h2>Our Date Plan 💕</h2>

<div class="card">

<p><b>Date:</b> <span id="showDate"></span></p>

<p><b>Time:</b> <span id="showTime"></span></p>

<p><b>Food:</b> <span id="showFood"></span></p>

<p><b>Place:</b> <span id="showPlace"></span></p>

</div>

<button id="copyBtn">Copy Plan 📋</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
